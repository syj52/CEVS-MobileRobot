<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-Center 协议测试台</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --border: #2a3a50;
    --text: #e8edf4;
    --muted: #7a8ba0;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --purple: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Consolas', 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }

  h1 { font-size: 1.5rem; margin-bottom: 4px; color: var(--accent); letter-spacing: 2px; }
  .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 20px; }

  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; max-width: 1100px; width: 100%; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .panel-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

  /* Status bar */
  .status-bar { display: flex; gap: 10px; margin-bottom: 20px; font-size: 0.8rem; }
  .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
  .badge-esp { background: #1a2a1a; color: var(--muted); border: 1px solid #2a3a2a; }
  .badge-esp.connected { background: #0d2818; color: var(--green); border-color: var(--green); }
  .badge-tcp { background: #1a1a2a; color: var(--muted); border: 1px solid #2a2a3a; }
  .badge-tcp.connected { background: #0d1828; color: var(--accent); border-color: var(--accent); }
  .badge-status { background: #1a1a1a; color: var(--muted); border: 1px solid #2a2a2a; }
  .badge-status.moving { background: #1a1800; color: var(--yellow); border-color: var(--yellow); }
  .badge-status.idle { background: #001a0d; color: var(--green); border-color: var(--green); }
  .badge-status.error { background: #1a0000; color: var(--red); border-color: var(--red); }

  /* Robot state display */
  .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .state-item { background: #111820; border-radius: 6px; padding: 10px 12px; }
  .state-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .state-value { font-size: 1.1rem; color: var(--accent); margin-top: 2px; }

  /* Buttons */
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #111820; color: var(--text); font-family: inherit; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #1e2a3a; border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn.green { border-color: var(--green); color: var(--green); }
  .btn.green:hover { background: #0d2818; }
  .btn.red { border-color: var(--red); color: var(--red); }
  .btn.red:hover { background: #1a0808; }
  .btn.purple { border-color: var(--purple); color: var(--purple); }
  .btn.purple:hover { background: #1a0818; }
  .btn.full { grid-column: 1 / -1; }

  /* Nav input */
  .nav-form { display: grid; grid-template-columns: 60px 1fr; gap: 6px; align-items: center; margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
  .nav-form input { background: #111820; border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 7px 10px; font-family: inherit; font-size: 0.85rem; }
  .nav-form input:focus { outline: none; border-color: var(--accent); }
  .nav-form label { text-align: right; }

  /* Log */
  .log-container { flex: 1; overflow-y: auto; max-height: 520px; }
  .log-line { padding: 3px 0; font-size: 0.8rem; border-bottom: 1px solid #0f1820; display: flex; gap: 10px; }
  .log-line .ts { color: var(--muted); min-width: 75px; }
  .log-line .dir { min-width: 36px; font-weight: bold; }
  .log-line .dir.tx { color: var(--accent); }
  .log-line .dir.rx { color: var(--green); }
  .log-line .dir.err { color: var(--red); }
  .log-line .dir.info { color: var(--muted); }
  .log-line .dir.sys { color: var(--yellow); }
  .log-line .msg { color: var(--text); }
  .log-line .msg.cmd { color: #60a5fa; }
  .log-line .msg.res { color: #34d399; }
  .log-line .msg.err { color: #f87171; }
  .log-line .msg.sys { color: var(--yellow); }

  .log-clear { margin-top: 10px; }
  .log-clear .btn { width: 100%; font-size: 0.75rem; padding: 6px; }

  /* Responsive */
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .log-container { max-height: 300px; }
  }
</style>
</head>
<body>

<h1>ESP32-Center 协议测试台</h1>
<p class="subtitle">临时测试工具 · 不要用于生产环境</p>

<!-- Status bar -->
<div class="status-bar">
  <span class="badge badge-esp" id="espBadge">ESP 未连接</span>
  <span class="badge badge-tcp" id="tcpBadge">Center 离线</span>
  <span class="badge badge-status idle" id="statusBadge">IDLE</span>
</div>

<div class="layout">
  <!-- Left: Controls -->
  <div>
    <!-- Robot State -->
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">机器人状态</div>
      <div class="state-grid">
        <div class="state-item">
          <div class="state-label">X</div>
          <div class="state-value" id="posX">0.00</div>
        </div>
        <div class="state-item">
          <div class="state-label">Y</div>
          <div class="state-value" id="posY">0.00</div>
        </div>
      </div>
      <div class="state-grid">
        <div class="state-item">
          <div class="state-label">最后更新</div>
          <div class="state-value" id="lastUpdate" style="font-size:0.8rem">—</div>
        </div>
        <div class="state-item">
          <div class="state-label">RTT</div>
          <div class="state-value" id="rtt" style="font-size:0.8rem">—</div>
        </div>
      </div>
    </div>

    <!-- Direct Commands -->
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">指令发送</div>
      <div class="btn-grid">
        <button class="btn green" onclick="sendPing()">PING</button>
        <button class="btn purple" onclick="sendNav(1, 1)">NAV 1,1</button>
        <button class="btn purple" onclick="sendNav(5, 3)">NAV 5,3</button>
        <button class="btn purple" onclick="sendNav(0, 0)">NAV 0,0</button>
        <button class="btn red full" onclick="sendStop()">STOP 紧急停止</button>
      </div>

      <div class="nav-form">
        <label>X</label>
        <input type="number" id="navX" value="3.0" step="0.1">
        <label>Y</label>
        <input type="number" id="navY" value="2.0" step="0.1">
        <label>Speed</label>
        <input type="number" id="navSpeed" value="1.0" step="0.1">
        <label>&nbsp;</label>
        <button class="btn green" onclick="sendNavCustom()" style="padding:7px">发送自定义 NAV</button>
      </div>
    </div>

    <!-- Test Suite -->
    <div class="panel">
      <div class="panel-title">测试套件</div>
      <div class="btn-grid">
        <button class="btn full" onclick="runTestSuite()" id="runAllBtn">▶ 运行全部测试</button>
        <button class="btn" onclick="tcPing()">TC-1 PING</button>
        <button class="btn" onclick="tcNav()">TC-2 NAV</button>
        <button class="btn" onclick="tcNavSpeed()">TC-3 NAV+speed</button>
        <button class="btn" onclick="tcStop()">TC-4 STOP</button>
        <button class="btn" onclick="tcError()">TC-5 ERR</button>
      </div>
    </div>
  </div>

  <!-- Right: Log -->
  <div class="panel">
    <div class="panel-title">通信日志</div>
    <div class="log-container" id="logContainer"></div>
    <div class="log-clear">
      <button class="btn" onclick="clearLog()">清空日志</button>
    </div>
  </div>
</div>

<script>
  const BASE = window.location.origin;
  let espConnected = false;
  let pollInterval = null;
  let rttStart = 0;

  // ─── Log ───────────────────────────────────────────────────────
  function ts() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
  }

  function log(dir, msg, msgClass = '') {
    const container = document.getElementById('logContainer');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="ts">${ts()}</span><span class="dir ${dir}">${dir.toUpperCase()}</span><span class="msg ${msgClass}">${escapeHtml(msg)}</span>`;
    container.appendChild(line);
    container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function clearLog() {
    document.getElementById('logContainer').innerHTML = '';
    log('sys', '日志已清空', 'sys');
  }

  // ─── API Calls ─────────────────────────────────────────────────
  function setStatus(status) {
    const badge = document.getElementById('statusBadge');
    badge.textContent = status.toUpperCase();
    badge.className = `badge badge-status ${status}`;
  }

  async function http(method, path, body = null) {
    rttStart = performance.now();
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(BASE + path, opts);
    const data = await res.json().catch(() => ({}));
    const rtt = Math.round(performance.now() - rttStart);
    document.getElementById('rtt').textContent = rtt + 'ms';
    return { status: res.status, data, rtt };
  }

  async function pollState() {
    try {
      const { data } = await http('GET', '/api/robot');
      document.getElementById('posX').textContent = data.position?.x?.toFixed(2) ?? '—';
      document.getElementById('posY').textContent = data.position?.y?.toFixed(2) ?? '—';
      document.getElementById('lastUpdate').textContent = data.lastUpdate
        ? new Date(data.lastUpdate).toLocaleTimeString()
        : '—';

      const st = data.status || 'unknown';
      setStatus(st);

      // ESP is connected if we get a response and state is non-stale
      if (!espConnected) {
        espConnected = true;
        document.getElementById('espBadge').textContent = 'ESP 已连接';
        document.getElementById('espBadge').className = 'badge badge-esp connected';
        log('sys', '检测到 ESP 连接', 'sys');
      }
      document.getElementById('tcpBadge').textContent = 'Center 在线';
      document.getElementById('tcpBadge').className = 'badge badge-tcp connected';
    } catch (e) {
      espConnected = false;
      document.getElementById('espBadge').textContent = 'ESP 未连接';
      document.getElementById('espBadge').className = 'badge badge-esp';
      document.getElementById('tcpBadge').textContent = 'Center 离线';
      document.getElementById('tcpBadge').className = 'badge badge-tcp';
    }
  }

  // ─── Commands ──────────────────────────────────────────────────
  async function sendPing() {
    log('tx', 'CMD:PING');
    log('rx', '(PING 无 HTTP 端点，通过 /api/robot 间接验证)', 'sys');
    await pollState();
  }

  async function sendNav(x, y, speed = 1.0) {
    const cmd = `CMD:NAV:x=${x},y=${y},speed=${speed}`;
    log('tx', cmd, 'cmd');
    const { status, data, rtt } = await http('POST', '/api/nav', { x, y, speed });
    log('rx', `${status} ${JSON.stringify(data)}  (${rtt}ms)`, status < 400 ? 'res' : 'err');
    await pollState();
  }

  async function sendNavCustom() {
    const x = parseFloat(document.getElementById('navX').value);
    const y = parseFloat(document.getElementById('navY').value);
    const speed = parseFloat(document.getElementById('navSpeed').value) || 1.0;
    if (isNaN(x) || isNaN(y)) { alert('请输入有效的 x 和 y'); return; }
    await sendNav(x, y, speed);
  }

  async function sendStop() {
    const cmd = 'CMD:STOP';
    log('tx', cmd, 'cmd');
    const { status, data, rtt } = await http('POST', '/api/stop');
    log('rx', `${status} ${JSON.stringify(data)}  (${rtt}ms)`, status < 400 ? 'res' : 'err');
    await pollState();
  }

  // ─── Test Suite ────────────────────────────────────────────────
  async function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function tcPing() {
    log('info', '═══ TC-1: PING ═══', 'sys');
    await sendPing();
    log('info', 'TC-1 期望: ESP 串口应显示 "recv: CMD:PING"', 'sys');
  }

  async function tcNav() {
    log('info', '═══ TC-2: NAV (x=1, y=1) ═══', 'sys');
    await sendNav(1, 1);
    log('info', 'TC-2 期望: ESP 串口 → "Nav started to (1.00, 1.00)"，3~8秒后 → "EXEC:A"', 'sys');
  }

  async function tcNavSpeed() {
    log('info', '═══ TC-3: NAV with speed (x=5, y=3, speed=2) ═══', 'sys');
    await sendNav(5, 3, 2.0);
    log('info', 'TC-3 期望: ESP 串口 → "Nav started to (5.00, 3.00), speed=2.00"', 'sys');
  }

  async function tcStop() {
    log('info', '═══ TC-4: STOP ═══', 'sys');
    await sendStop();
    log('info', 'TC-4 期望: ESP 串口 → "Nav stopped"', 'sys');
  }

  async function tcError() {
    log('info', '═══ TC-5: 错误格式测试 ═══', 'sys');
    // TC-5 需要通过 tcp_server.py 手动测试，这里只记录
    log('info', 'TC-5 请手动: python tcp_server.py → 发送 "HELLO" (非 CMD: 格式)', 'sys');
    log('info', 'TC-5 期望: Center 回复 ERR:EXPECTED_CMD', 'sys');
  }

  async function runTestSuite() {
    const btn = document.getElementById('runAllBtn');
    btn.disabled = true;
    btn.textContent = '测试中...';
    clearLog();
    log('sys', '开始运行测试套件...', 'sys');
    await delay(500);

    await tcPing(); await delay(1000);
    await tcNav();  await delay(8000); // 等待模拟到达
    await tcNavSpeed(); await delay(8000);
    await tcStop(); await delay(500);
    await tcError();

    log('sys', '═══ 测试套件完成 ═══', 'sys');
    btn.disabled = false;
    btn.textContent = '▶ 运行全部测试';
  }

  // ─── Init ──────────────────────────────────────────────────────
  pollState();
  pollInterval = setInterval(pollState, 2000);
  log('sys', `连接 Center: ${BASE}`, 'sys');
  log('sys', '等待 ESP32 连接...', 'sys');
</script>
</body>
</html>
